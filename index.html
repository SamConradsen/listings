<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <title>Sam's Listing Organizer</title>
    <style>
        /* Eksempel på stilopsætning til de stramme rammer og pop-up */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f6f8;
            margin: 0;
            padding: 20px;
        }

        .sold-section {
            max-width: 1400px;
            margin: 0 auto;
        }

        /* Grid / Række opsætning med max 6 varer pr. række */
        .grid-row {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 15px;
            margin-bottom: 20px;
            position: relative;
        }

        /* Bundle rammer der omslutter specifikke varer tæt */
        .bundle-box {
            border: 2px solid #333;
            border-radius: 8px;
            padding: 10px;
            display: contents; /* Gør at de indlejrede elementer følger gridden direkte, men rammen omslutter dem visuelt */
        }

        /* Alternativ container-løsning for præcise rammer der bryder ud til højre/venstre */
        .bundle-wrapper {
            border: 2px solid #333;
            border-radius: 8px;
            padding: 10px;
            background: #fff;
            margin-bottom: 15px;
        }

        /* Pop-up styling */
        .modal {
            display: none; /* Sættes til block ved åbning */
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            z-index: 1000;
            width: 450px;
        }

        .platform-row {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-bottom: 15px;
        }

        .platform-logo, .shipping-logo {
            width: 32px;
            height: 32px;
            object-fit: contain;
            cursor: pointer;
            border: 2px solid transparent;
            border-radius: 4px;
        }

        .platform-logo.selected, .shipping-logo.selected {
            border-color: #000;
        }
    </style>
</head>
<body>

    <div class="sold-section">
        <h2>Solgte varer</h2>
        <!-- Her indsættes dynamisk rækker og tætsiddende bundle-rammer -->
    </div>

    <!-- Pop-up vindue med rettet rækkefølge og små platform-logoer på én række -->
    <div id="soldModal" class="modal">
        <h3>Rediger salg</h3>
        
        <label>Platform:</label>
        <div class="platform-row" id="platformRow">
            <!-- Platform logoer i lille størrelse på én række -->
            <img src="vinted-logo.png" class="platform-logo" alt="Vinted">
            <img src="dba-logo.png" class="platform-logo" alt="DBA">
            <img src="tradera-logo.png" class="platform-logo" alt="Tradera">
        </div>

        <label>Salgsdato:</label>
        <input type="text" id="saleDate">

        <label>Salgspris:</label>
        <input type="text" id="salePrice">

        <label>Købers brugernavn:</label>
        <input type="text" id="buyerUsername">

        <label>Fragtfirma:</label>
        <div class="platform-row" id="shippingRow">
            <img src="dao-logo.png" class="shipping-logo" alt="DAO">
            <img src="gls-logo.png" class="shipping-logo" alt="GLS">
        </div>

        <label>Destination:</label>
        <!-- Destination / flag -->

        <label>Sporingsnummer:</label>
        <input type="text" id="trackingNumber">

        <div class="modal-buttons" style="margin-top: 15px; display: flex; justify-content: flex-end; gap: 10px;">
            <button id="cancelBtn">Annuller</button>
            <button id="notSoldBtn">Ikke solgt</button>
            <button id="saveBtn" style="background: #000; color: #fff;">Gem</button>
        </div>
    </div>

    <script>
        // Logik til at gruppere varer efter salgsdato og køber, 
        // samt styre at rammerne klipper korrekt ved ryk til næste række.
        console.log("Klar til integration i din eksisterende løsning.");
    </script>
</body>
</html>
